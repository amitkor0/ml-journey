name: CI

# Keeps the standard set in ruff.toml honest as notebooks and projects are
# added. Fast by design - this runs on every push, so it must stay under a
# couple of minutes or it stops being useful.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run ruff check
        run: uvx ruff check --output-format=github .

  format:
    name: Lint (ruff format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check formatting
        run: uvx ruff format --check --diff .

  notebooks:
    name: Notebooks are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install notebook tooling
        run: python -m pip install --quiet nbformat

      # Deliberately does not execute notebooks. Most depend on datasets and
      # on the module-specific environments, so execution belongs to a
      # deliberate local or Colab run, not to every push.
      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import nbformat

          failures = 0
          notebooks = sorted(pathlib.Path(".").rglob("*.ipynb"))
          if not notebooks:
              print("No notebooks committed yet.")

          for path in notebooks:
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
              except Exception as exc:
                  failures += 1
                  print(f"FAIL {path}: {exc}")
              else:
                  print(f"ok   {path}")

          sys.exit(1 if failures else 0)
          PY
